name: Collect X Posts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  collect:
    # Standard GitHub-hosted runner; works on the free Actions tier.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Collect latest posts
        run: |
          python -m x_workflows_collector.cli \
            --accounts-file config/accounts.json \
            --output output/latest_posts.json

      - name: Upload collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-x-posts
          path: output/latest_posts.json
